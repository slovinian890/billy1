<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
body { margin: 0; background: #fffaf3; }
a { color: inherit; text-decoration: none; }
a:hover { color: inherit; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #fffaf3; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #2b2528; display: flex; flex-direction: column">

  <div style="flex-grow: 1; position: relative; overflow: hidden">
    <div style="padding: 44px 20px 36px">

      <div style="display: flex; flex-direction: column; align-items: center; margin-top: 16px; margin-bottom: 20px">
        <button aria-label="Change photo" style="position: relative; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; display: block">
          <span style="display: flex; align-items: center; justify-content: center; width: 96px; height: 96px; box-sizing: border-box; border-radius: 999px; background: {{accent}}; border: 3px solid #ffffff; color: #ffffff; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 36px; font-weight: 700; overflow: hidden">YO</span>
          <span style="position: absolute; right: -2px; bottom: -2px; width: 30px; height: 30px; box-sizing: border-box; border-radius: 999px; background: {{accent}}; border: 2px solid #fffaf3; display: flex; align-items: center; justify-content: center">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9.5h3.4l1.3-2h7.6l1.3 2h3.4a1 1 0 0 1 1 1v7.4a1.6 1.6 0 0 1-1.6 1.6H4.1a1.6 1.6 0 0 1-1.6-1.6V10.5a1 1 0 0 1 1-1Z"/><circle cx="12" cy="14" r="3.4"/></svg>
          </span>
        </button>
        <div style="font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 26px; line-height: 32px; color: #2b2528; margin-top: 16px">You</div>
        <div style="font-size: 14px; font-weight: 500; color: #a09791; margin-top: 2px">@[username]</div>
        <p style="margin: 12px 0 0; padding: 0 16px; font-size: 14.5px; font-weight: 500; line-height: 21px; color: #8a7f79; text-align: center">[A line or two about you — it shows here, under your name.]</p>
      </div>

      <div style="display: flex; gap: 12px; margin-bottom: 16px">
        <div style="flex: 1 1 0; background: #f5eee7; border-radius: 28px; padding: 12px 16px">
          <div style="font-size: 10.5px; font-weight: 700; letter-spacing: 0.8px; color: #a09791; margin-bottom: 4px">LOVES TO EAT</div>
          <div style="font-size: 15px; font-weight: 600; color: #2b2528">[Food]</div>
        </div>
        <div style="flex: 1 1 0; background: #f5eee7; border-radius: 28px; padding: 12px 16px">
          <div style="font-size: 10.5px; font-weight: 700; letter-spacing: 0.8px; color: #a09791; margin-bottom: 4px">LOVES TO DRINK</div>
          <div style="font-size: 15px; font-weight: 600; color: #2b2528">[Drink]</div>
        </div>
      </div>

      <div style="background: #ffffff; border: 1px solid #eee4dc; border-radius: 28px; overflow: hidden; box-shadow: 0 6px 16px rgba(43, 37, 40, 0.06); margin-bottom: 16px">
        <button style="display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; padding: 16px; background: none; border: 0; font: inherit; cursor: pointer; text-align: left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2b2528" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4.2L19 9.2 14.8 5 4 15.8V20Z"/><path d="M13.4 6.4l4.2 4.2"/></svg>
          <span style="flex-grow: 1; font-size: 15px; font-weight: 600; color: #2b2528">Edit profile</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a09791" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <div style="height: 1px; background: #eee4dc; margin-left: 48px"></div>
        <button style="display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; padding: 16px; background: none; border: 0; font: inherit; cursor: pointer; text-align: left">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.2 4.5H5.6A1.6 1.6 0 0 0 4 6.1v11.8a1.6 1.6 0 0 0 1.6 1.6h3.6"/><path d="M15.2 8.2 19 12l-3.8 3.8"/><path d="M19 12H9.6"/></svg>
          <span style="flex-grow: 1; font-size: 15px; font-weight: 600; color: {{accent}}">Sign out</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a09791" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>

      <div style="font-size: 12.5px; font-weight: 500; color: #a09791; text-align: center">[your@email.com] · member since [Month Year]</div>

    </div>
  </div>

  <nav style="display: flex; background: #ffffff; border-top: 1px solid #eee4dc; padding: 8px 0 28px; flex-shrink: 0">
    <a href="Main.dc.html" aria-label="Scan a receipt" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 2px">
      <span style="width: 40px; height: 40px; border-radius: 18px; background: #ffb4a3; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9.5h3.4l1.3-2h7.6l1.3 2h3.4a1 1 0 0 1 1 1v7.4a1.6 1.6 0 0 1-1.6 1.6H4.1a1.6 1.6 0 0 1-1.6-1.6V10.5a1 1 0 0 1 1-1Z"/><circle cx="12" cy="14" r="3.4"/></svg>
      </span>
      <span style="font-size: 11px; font-weight: 600; color: #a09791">Scan</span>
    </a>
    <a href="Bills.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 2px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a09791" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3.5h14v15.6l-2.3-1.6-2.4 1.6-2.3-1.6-2.3 1.6L7.3 17.5 5 19.1V3.5Z"/><path d="M9 8.2h6"/><path d="M9 12.2h6"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: #a09791">Bills</span>
    </a>
    <a href="Friends.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 2px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a09791" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9.2" cy="8" r="3.2"/><path d="M3.6 19c0-3.1 2.5-5.4 5.6-5.4s5.6 2.3 5.6 5.4"/><circle cx="17.2" cy="9.2" r="2.5"/><path d="M16.2 14.3c2.6.2 4.4 2.2 4.4 4.7"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: #a09791">Friends</span>
    </a>
    <a href="Memories.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 2px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a09791" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7.2" width="13.8" height="11.8" rx="2.6"/><circle cx="7.4" cy="11.2" r="1.3"/><path d="M3.4 16.6 7.8 13l4.2 3.3"/><path d="M8.2 7.2V5.6A1.9 1.9 0 0 1 10.1 3.7h8.9A1.9 1.9 0 0 1 21 5.6v8.9a1.9 1.9 0 0 1-1.9 1.9h-1.6"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: #a09791">Memories</span>
    </a>
    <a href="Profile.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 2px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.8"/><circle cx="12" cy="9.8" r="2.9"/><path d="M6.3 18.8a6.6 6.6 0 0 1 11.4 0"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: {{accent}}">Profile</span>
    </a>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff5d47","options":["#ff5d47","#6150c6","#159a8a","#e3a134"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#ff5d47' };
  }
}
</script>
</body>
</html>
