<html lang="en">
<head>

<body>
<x-dc>

<style>

<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #fffaf3; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #2b2528; display: flex; flex-direction: column">

      <div style="background: #ffffff; border: 1px solid #eee4dc; border-radius: 28px; padding: 36px 20px; box-shadow: 0 6px 16px rgba(43, 37, 40, 0.06); display: flex; flex-direction: column; align-items: center">

        <p style="margin: 0; padding: 0 12px; font-size: 14.5px; font-weight: 500; line-height: 21px; color: #8a7f79; text-align: center">Friend requests, search, and recently-billed-together land in Phase 3, once accounts are wired up.</p>
      </div>

    </div>
  </div>

  <nav style="display: flex; background: #ffffff; border-top: 1px solid #eee4dc; padding: 8px 0 28px; flex-shrink: 0">
    <a href="Main.dc.html" aria-label="Scan a receipt" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 2px">
      <span style="width: 40px; height: 40px; border-radius: 18px; background: #ffb4a3; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9.5h3.4l1.3-2h7.6l1.3 2h3.4a1 1 0 0 1 1 1v7.4a1.6 1.6 0 0 1-1.6 1.6H4.1a1.6 1.6 0 0 1-1.6-1.6V10.5a1 1 0 0 1 1-1Z"/><circle cx="12" cy="14" r="3.4"/></svg>

    <a href="Bills.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 2px">

      <span style="font-size: 11px; font-weight: 600; color: #a09791">Bills</span>
    </a>
    <a href="Friends.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 2px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9.2" cy="8" r="3.2"/><path d="M3.6 19c0-3.1 2.5-5.4 5.6-5.4s5.6 2.3 5.6 5.4"/><circle cx="17.2" cy="9.2" r="2.5"/><path d="M16.2 14.3c2.6.2 4.4 2.2 4.4 4.7"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: {{accent}}">Friends</span>
    </a>
    <a href="Memories.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 2px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a09791" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7.2" width="13.8" height="11.8" rx="2.6"/><circle cx="7.4" cy="11.2" r="1.3"/><path d="M3.4 16.6 7.8 13l4.2 3.3"/><path d="M8.2 7.2V5.6A1.9 1.9 0 0 1 10.1 3.7h8.9A1.9 1.9 0 0 1 21 5.6v8.9a1.9 1.9 0 0 1-1.9 1.9h-1.6"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: #a09791">Memories</span>
    </a>
    <a href="Profile.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 2px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a09791" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.8"/><circle cx="12" cy="9.8" r="2.9"/><path d="M6.3 18.8a6.6 6.6 0 0 1 11.4 0"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: #a09791">Profile</span>
    </a>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff5d47","options":["#ff5d47","#6150c6","#159a8a","#e3a134"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#ff5d47' };
  }
}
</script>
</body>
</html>
